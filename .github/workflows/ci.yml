name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build LaMeridienne.slnx -c Release

      - name: Tests (PostgreSQL via Testcontainers)
        run: dotnet test LaMeridienne.slnx -c Release --no-build

      - name: Documentation
        run: |
          echo '{"args":["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          PUPPETEER_CONFIG="$RUNNER_TEMP/puppeteer.json" ./docs/check-docs.sh

      - name: Image Docker
        run: docker build -t lameridienne-api:ci .
