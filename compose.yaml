# Développement local uniquement : identifiants factices.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: lameridienne
      POSTGRES_USER: lameridienne
      POSTGRES_PASSWORD: lameridienne
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lameridienne -d lameridienne"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
