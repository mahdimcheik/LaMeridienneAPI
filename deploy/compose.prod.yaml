# Production : API + PostgreSQL + sauvegarde. Nginx Proxy Manager (hors de ce fichier) termine
# TLS et joint l'API par le réseau externe ${PROXY_NETWORK}. Aucun port n'est publié.
# Usage (depuis la racine du dépôt) : docker compose -f deploy/compose.prod.yaml up -d --build
name: lameridienne

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: lameridienne
      POSTGRES_USER: lameridienne
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manque dans deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lameridienne -d lameridienne"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applique les migrations en attente à chaque démarrage, puis crée les comptes manquants.
  api:
    build: ..
    image: lameridienne-api:latest
    container_name: lameridienne-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    # L'API lit elle-même ses secrets (POSTGRES_*, JWT_KEY, SEED_USER_*) dans ce fichier.
    volumes:
      - ./.env:/app/.env:ro
    networks: [internal, proxy]
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    image: postgres:17
    restart: unless-stopped
    entrypoint: ["bash", "/backup.sh"]
    environment:
      TZ: Europe/Paris
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      PGHOST: postgres
      PGDATABASE: lameridienne
      PGUSER: lameridienne
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

networks:
  internal:
  proxy:
    name: ${PROXY_NETWORK:-global-network}
    external: true
